services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-dms}
      MYSQL_USER: ${MYSQL_USER:-dms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
    volumes:
      - dms-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./server
    restart: always
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOST: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN required}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./client
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL required}
      NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_SOCKET_URL:?PUBLIC_SOCKET_URL required}
    depends_on:
      - api

volumes:
  dms-mysql:
