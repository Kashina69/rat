services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rat
      MYSQL_USER: rat
      MYSQL_PASSWORD: rat
    ports:
      - "3306:3306"
    volumes:
      - rat-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "rat", "-prat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  rat-mysql:
